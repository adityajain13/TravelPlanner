<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect width="96" height="96" rx="22" fill="#0e1110"/>
  <!-- Outer globe ring -->
  <circle cx="48" cy="48" r="34" fill="none" stroke="#5fd68b" stroke-width="2.2"/>
  <!-- Equator -->
  <line x1="14" y1="48" x2="82" y2="48" stroke="#5fd68b" stroke-width="1.2" opacity="0.55"/>
  <!-- Upper latitude -->
  <line x1="20" y1="32" x2="76" y2="32" stroke="#5fd68b" stroke-width="0.8" opacity="0.3"/>
  <!-- Lower latitude -->
  <line x1="20" y1="64" x2="76" y2="64" stroke="#5fd68b" stroke-width="0.8" opacity="0.3"/>
  <!-- Prime meridian ellipse -->
  <ellipse cx="48" cy="48" rx="16" ry="34" fill="none" stroke="#5fd68b" stroke-width="1.2" opacity="0.55"/>
  <!-- Side meridian ellipse -->
  <ellipse cx="48" cy="48" rx="30" ry="34" fill="none" stroke="#5fd68b" stroke-width="0.7" opacity="0.28"/>
  <!-- Centre dot -->
  <circle cx="48" cy="48" r="3.5" fill="#5fd68b"/>
</svg>
