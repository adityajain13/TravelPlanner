name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check one-time setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repo secret (see README)"; exit 1; fi
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then echo "::error::Create the D1 database and put its id in wrangler.jsonc (see README)"; exit 1; fi

      - name: Build
        run: npm run build
        env:
          VITE_PROTOMAPS_KEY: ${{ secrets.VITE_PROTOMAPS_KEY }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_GOOGLE_PLACES_KEY: ${{ secrets.VITE_GOOGLE_PLACES_KEY }}

      - name: Migrate database
        run: npx wrangler d1 migrations apply travelplanner --remote

      - name: Deploy Worker
        run: npx wrangler deploy
